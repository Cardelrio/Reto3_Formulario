
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de la persona Usuaria</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="contenedor">
        <header id="encabezado">
            <h1>Registro de la persona Usuaria</h1>
            <p>Completa tus datos en el siguiente formulario.</p>
        </header>

        <form id="formulario-registro">
            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Escribe tu nombre" required>
            </div>

            <div class="campo">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido"
                       placeholder="Escribe tu apellido" required>
            </div>

            <div class="campo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo"
                       placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena"
                       minlength="8" placeholder="Mínimo 8 caracteres"
                       required>
            </div>

            <div class="campo">
                <label for="descripcion">Descripción personal:</label>
                <textarea id="descripcion" name="descripcion"
                          rows="4"
                          placeholder="Cuéntanos un poco sobre ti"></textarea>
            </div>

            <fieldset class="intereses">
                <legend>Selecciona tus intereses:</legend>

                <label>
                    <input type="checkbox" name="intereses"
                           value="tecnologia">
                    Tecnología
                </label>

                <label>
                    <input type="checkbox" name="intereses"
                           value="arte">
                    Arte
                </label>

                <label>
                    <input type="checkbox" name="intereses"
                           value="deporte">
                    Deporte
                </label>
            </fieldset>

            <button type="submit" id="boton-registro">
                Registrarse
            </button>

            <p id="mensaje" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script>
        const formulario = document.getElementById("formulario-registro");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();
            mensaje.textContent =
                "Formulario completado correctamente. " +
                "Este es un ejercicio de práctica.";
        });
    </script>
</body>
</html>
